<!DOCTYPE html>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- React & ReactDOM -->

    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel for JSX -->

                            {/* Headline */}
                            <h1 className="text-5xl sm:text-6xl lg:text-7xl font-extrabold text-primary tracking-tight mb-6 leading-[1.1]">
                                Travel the World.<br/>
                                <span className="text-indigoBtn">Stay with Students.</span>
                            </h1>
                            
                            {/* Subtitle */}
                            <p className="max-w-2xl mx-auto text-lg sm:text-xl text-slate-600 leading-relaxed mb-12 font-medium">

                            </p>

                            {/* --- BENTO SEARCH BAR --- */}

                                        <IconCalendar />
                                    </div>
                                    <div>

                                </button>

                                <div className="bg-white p-8 rounded-3xl border border-slate-200/60 shadow-sm hover:shadow-md transition-shadow">
                                    <div className="w-12 h-12 bg-indigo-50 rounded-2xl flex items-center justify-center text-indigoBtn mb-6">
                                        <IconSearch />
                                    </div>
                                    <h3 className="text-xl font-bold text-primary mb-3">2. Ev Sahibini Bul</h3>

                                </div>
                                <div className="bg-white p-8 rounded-3xl border border-slate-200/60 shadow-sm hover:shadow-md transition-shadow">
                                    <div className="w-12 h-12 bg-orange-50 rounded-2xl flex items-center justify-center text-accent mb-6">

                            </div>

                                            <img src={listing.image} alt={listing.location} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700 ease-out" />
                                            
                                            {/* Badges */}
                                            <div className="absolute top-3 left-3 bg-white/95 backdrop-blur-md px-3 py-1.5 rounded-xl text-[11px] font-bold flex items-center gap-1.5 shadow-sm text-primary">
                                                <IconShield className="w-3.5 h-3.5 text-emerald-500" /> Onaylı
                                            </div>
                                            <div className="absolute bottom-3 right-3 bg-primary/80 backdrop-blur-md text-white px-3 py-1.5 rounded-xl text-[11px] font-bold shadow-sm">

                                        </div>

                                        <div className="p-5 pt-3 flex-1 flex flex-col">

                                                <div className="flex items-center gap-1 text-sm font-bold text-slate-700">

                                                    </span>
                                                ))}
                                                {listing.tags.length > 2 && (
                                                    <span className="text-[10px] uppercase tracking-wider font-bold px-2 py-1 bg-slate-100 text-slate-500 rounded-md">

                                                    </span>
                                                )}

                                        </div>
                                    </div>
                                ))}

                    <footer className="bg-primary text-slate-400 py-12 border-t border-slate-800">

                            <div className="flex items-center gap-2 text-white">
                                <IconGradCap />
                                <span className="text-xl font-extrabold tracking-tight">UniCouch</span>
                            </div>
                            <div className="text-sm font-medium">
                                &copy; 2026 UniCouch Platform. Tüm hakları saklıdır.
                            </div>
                            <div className="flex gap-6 text-sm font-semibold">

                                <a href="#" className="hover:text-white transition-colors">İletişim</a>
                            </div>

                </div>
            );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
