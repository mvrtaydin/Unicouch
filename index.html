<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UniCouch | Öğrenci Konaklama ve Sosyalleşme Platformu</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brandDark: '#0F172A',
            brandIndigo: '#4F46E5',
            brandCoral: '#FF5A36',
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- React & Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    .glass-header {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(12px);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade {
      animation: fadeIn 0.25s ease-out forwards;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    // --- LUCIDE TARZI SVG İKON BİLEŞENLERİ ---
    const IconCompass = () => (
      <svg className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/>
      </svg>
    );
    const IconSearch = () => (
      <svg className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
    );
    const IconVerified = ({ className = "w-5 h-5 text-sky-400" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2zm-1.9 14.7L6 12.6l1.5-1.5 2.6 2.6 6.4-6.4 1.5 1.5-7.9 7.9z"/>
      </svg>
    );
    const IconPin = () => (
      <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>
      </svg>
    );
    const IconCalendar = () => (
      <svg className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
      </svg>
    );
    const IconClose = () => (
      <svg className="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    );
    const IconBed = () => (
      <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M2 4v16"/><path d="M2 8h18a2 2 0 0 1 2 2v10"/><path d="M2 17h20"/><path d="M6 8v9"/>
      </svg>
    );
    const IconMessage = () => (
      <svg className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
    );

    // --- MOCK VERİ SETİ ---
    const STUDENTS_DATA = [
      {
        id: 101,
        name: "Jonas",
        age: 22,
        city: "Aachen",
        country: "Almanya",
        university: "RWTH Aachen",
        department: "Bilgisayar Mühendisliği",
        priceEUR: 10,
        roomType: "Özel Yataklı Misafir Odası",
        bio: "Kampüse yürüme mesafesinde bir öğrenci evinde kalıyorum. Boş zamanlarımda dağ bisikleti sürmeyi, açık kaynak kodlu projeler geliştirmeyi ve yeni kültürlerden insanlarla tanışmayı seviyorum. Şehre gelen öğrencilere kampüsü ve yerel mekanları gezdirmekten mutluluk duyarım.",
        interests: ["Bisiklet", "Yazılım", "Kahve", "Doğa Yürüyüşü", "Masa Oyunları"],
        photo: "https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?auto=format&fit=crop&w=900&q=80"
      },
      {
        id: 102,
        name: "Chloé",
        age: 21,
        city: "Paris",
        country: "Fransa",
        university: "Sorbonne Üniversitesi",
        department: "Görsel Sanatlar ve Tasarım",
        priceEUR: 12,
        roomType: "Salonda Rahat Açılır Kanepe",
        bio: "Sanat galerilerini gezmeyi, eskiz yapmayı ve sokak fotoğrafçılığını çok seviyorum. Evim metro durağına sadece 3 dakika uzaklıkta. Paris'i turistik kalabalıktan uzak, gerçek bir öğrenci gözüyle deneyimlemek isteyen gezginleri bekliyorum!",
        interests: ["Fotoğrafçılık", "Modern Sanat", "Sinema", "Müzik", "Kruvasan & Kahve"],
        photo: "https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=900&q=80"
      },
      {
        id: 103,
        name: "Lorenzo",
        age: 23,
        city: "Milano",
        country: "İtalya",
        university: "Politecnico di Milano",
        department: "Mimarlık",
        priceEUR: 14,
        roomType: "Paylaşımlı Öğrenci Odası",
        bio: "Mimari maketler ve tasarım projeleriyle dolu keyifli bir öğrenci evimiz var. Akşamları ev arkadaşlarımla İtalyan yemekleri pişirip müzik dinlemeyi severiz. Milano'nun tasarım sokaklarını keşfetmek için harika bir başlangıç noktası.",
        interests: ["Mimarlık", "İtalyan Mutfağı", "Gitar", "Tasarım", "Bisiklet"],
        photo: "https://images.unsplash.com/photo-1501196354995-cbb51c65aaea?auto=format&fit=crop&w=900&q=80"
      },
      {
        id: 104,
        name: "Sanne",
        age: 20,
        city: "Amsterdam",
        country: "Hollanda",
        university: "University of Amsterdam",
        department: "Sosyoloji",
        priceEUR: 15,
        roomType: "Özel Çalışma Masalı Oda",
        bio: "Kanalların hemen yakınında, aydınlık ve huzurlu bir apartman dairesinde yaşıyorum. Kitap kulüplerine katılmayı, elektronik müzik etkinliklerini ve şehir parklarında piknik yapmayı seviyorum. Misafirlerime yedek bisikletimi ödünç verebilirim!",
        interests: ["Bisiklet", "Sosyoloji", "Plak Koleksiyonu", "Kamp", "Sürdürülebilirlik"],
        photo: "https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=900&q=80"
      }
    ];

    const App = () => {
      // 1. STATE YÖNETİMİ
      const [activeTab, setActiveTab] = useState('home'); // 'home' veya 'discover'
      const [currency, setCurrency] = useState('EUR'); // 'EUR' veya 'TR'
      const [cityQuery, setCityQuery] = useState('');
      const [startDate, setStartDate] = useState('');
      const [endDate, setEndDate] = useState('');
      const [activeProfile, setActiveProfile] = useState(null); // Modal için seçili öğrenci
      const [toastMsg, setToastMsg] = useState(null);

      // Bildirim (Toast) Tetikleyici (3 saniye sonra kaybolur)
      const triggerToast = (text, isError = false) => {
        setToastMsg({ text, isError });
        setTimeout(() => {
          setToastMsg(null);
        }, 3000);
      };

      // Kur Hesaplama (1 EUR = 35 TL)
      const renderPrice = (eurAmount) => {
        return currency === 'EUR' ? `${eurAmount}€` : `${eurAmount * 35}₺`;
      };

      // Arama Fonksiyonu
      const handleSearchSubmit = (e) => {
        e.preventDefault();
        if (!cityQuery.trim()) {
          triggerToast("Lütfen aramak istediğiniz şehri veya üniversiteyi girin!", true);
          return;
        }
        setActiveTab('discover');
        triggerToast(`"${cityQuery}" için öğrenci ev sahipleri listelendi.`);
      };

      // Filtrelenmiş Liste
      const displayedStudents = STUDENTS_DATA.filter((student) => {
        if (!cityQuery.trim()) return true;
        const query = cityQuery.toLowerCase();
        return (
          student.city.toLowerCase().includes(query) ||
          student.university.toLowerCase().includes(query) ||
          student.country.toLowerCase().includes(query)
        );
      });

      return (
        <div className="min-h-screen flex flex-col">
          
          {/* --- TOAST BİLDİRİM BİLEŞENİ --- */}
          {toastMsg && (
            <div className="fixed bottom-6 right-6 left-6 sm:left-auto z-50 animate-fade">
              <div className={`px-5 py-4 rounded-2xl shadow-2xl font-semibold text-sm flex items-center gap-3 border ${
                toastMsg.isError 
                  ? 'bg-rose-600 text-white border-rose-500' 
                  : 'bg-brandDark text-white border-slate-700'
              }`}>
                <span className="w-2.5 h-2.5 rounded-full bg-amber-400 animate-ping"></span>
                <span>{toastMsg.text}</span>
              </div>
            </div>
          )}

          {/* --- 1. NAVBAR & NAVİGASYON --- */}
          <header className="sticky top-0 z-30 glass-header border-b border-slate-200/80">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
              
              {/* Logo */}
              <div 
                onClick={() => setActiveTab('home')}
                className="flex items-center gap-2.5 cursor-pointer group"
              >
                <div className="w-10 h-10 rounded-2xl bg-brandIndigo text-white flex items-center justify-center font-black text-xl shadow-md group-hover:bg-brandDark transition-colors">
                  U
                </div>
                <span className="text-2xl font-extrabold tracking-tight text-brandDark">
                  Uni<span className="text-brandIndigo">Couch</span>
                </span>
              </div>

              {/* Sekme Menüsü (Home / Discover) */}
              <nav className="flex items-center gap-2 bg-slate-100 p-1.5 rounded-2xl">
                <button
                  onClick={() => setActiveTab('home')}
                  className={`px-4 py-2 rounded-xl text-sm font-bold transition-all ${
                    activeTab === 'home' 
                      ? 'bg-white text-brandDark shadow-sm' 
                      : 'text-slate-600 hover:text-brandDark'
                  }`}
                >
                  Ana Sayfa
                </button>
                <button
                  onClick={() => setActiveTab('discover')}
                  className={`px-4 py-2 rounded-xl text-sm font-bold flex items-center gap-1.5 transition-all ${
                    activeTab === 'discover' 
                      ? 'bg-white text-brandIndigo shadow-sm' 
                      : 'text-slate-600 hover:text-brandDark'
                  }`}
                >
                  <IconCompass/>
                  <span>Keşfet</span>
                </button>
              </nav>

              {/* Sağ Aksiyonlar (Kur Değiştirici & Ev Sahibi Ol) */}
              <div className="flex items-center gap-3">
                <button
                  onClick={() => setCurrency(currency === 'EUR' ? 'TR' : 'EUR')}
                  className="px-3.5 py-2 rounded-xl border border-slate-300 bg-white hover:bg-slate-50 text-xs font-extrabold text-slate-700 transition-all shadow-sm"
                >
                  {currency === 'EUR' ? '💶 EUR (€)' : '🇹🇷 TR (₺)'}
                </button>

                <button
                  onClick={() => triggerToast("Ev sahibi modu yakında aktif olacak!")}
                  className="hidden sm:inline-flex bg-brandCoral hover:opacity-95 text-white px-5 py-2.5 rounded-xl text-sm font-bold shadow-md shadow-orange-500/20 transition-transform active:scale-95"
                >
                  Ev Sahibi Ol
                </button>
              </div>

            </div>
          </header>

          {/* --- ANA İÇERİK ALANI --- */}
          <main className="flex-1">
            
            {/* SEKME 1: HOME (HERO & ARAMA MOTORU) */}
            {activeTab === 'home' && (
              <section className="py-16 px-4 sm:px-6 lg:px-8 max-w-6xl mx-auto animate-fade">
                
                <div className="text-center max-w-3xl mx-auto mb-12">
                  <div className="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-indigo-50 text-brandIndigo text-xs font-bold mb-6 border border-indigo-100">
                    <IconVerified className="w-4 h-4 text-brandIndigo"/>
                    <span>.edu Öğrenci Belgesiyle Doğrulanmış Topluluk</span>
                  </div>
                  
                  <h1 className="text-4xl sm:text-6xl font-extrabold text-brandDark tracking-tight leading-tight mb-6">
                    Dünyayı Gez.<br />
                    <span className="text-brandIndigo">Öğrencilerle Konakla.</span>
                  </h1>
                  
                  <p className="text-slate-600 text-base sm:text-lg leading-relaxed">
                    Yüksek otel fiyatlarını geride bırak. Gittiğin şehirdeki üniversite öğrencilerinin yanında sembolik bir katkıyla konakla, kampüs kültürünü içeriden yaşa.
                  </p>
                </div>

                {/* Arama Motoru Barı */}
                <form 
                  onSubmit={handleSearchSubmit}
                  className="bg-white p-3 sm:p-4 rounded-3xl shadow-xl border border-slate-200/80 grid grid-cols-1 md:grid-cols-12 gap-3 max-w-4xl mx-auto"
                >
                  {/* Şehir Input */}
                  <div className="md:col-span-5 flex items-center gap-3 bg-slate-50 px-4 py-3 rounded-2xl border border-slate-200/60 focus-within:border-brandIndigo">
                    <span className="text-brandIndigo"><IconPin/></span>
                    <div className="w-full">
                      <label className="block text-[10px] font-bold uppercase text-slate-400">Şehir veya Üniversite</label>
                      <input
                        type="text"
                        placeholder="Aachen, Paris, Milano..."
                        value={cityQuery}
                        onChange={(e) => setCityQuery(e.target.value)}
                        className="w-full bg-transparent text-sm font-bold text-brandDark outline-none placeholder-slate-400"
                      />
                    </div>
                  </div>

                  {/* Giriş - Çıkış Tarihleri (Native Date) */}
                  <div className="md:col-span-4 flex items-center gap-3 bg-slate-50 px-4 py-3 rounded-2xl border border-slate-200/60">
                    <span className="text-brandIndigo"><IconCalendar/></span>
                    <div className="w-full">
                      <label className="block text-[10px] font-bold uppercase text-slate-400">Giriş - Çıkış Tarihi</label>
                      <div className="flex items-center gap-1">
                        <input
                          type="date"
                          value={startDate}
                          onChange={(e) => setStartDate(e.target.value)}
                          className="bg-transparent text-xs font-semibold text-slate-700 outline-none w-full"
                        />
                        <span className="text-slate-400">-</span>
                        <input
                          type="date"
                          value={endDate}
                          onChange={(e) => setEndDate(e.target.value)}
                          className="bg-transparent text-xs font-semibold text-slate-700 outline-none w-full"
                        />
                      </div>
                    </div>
                  </div>

                  {/* Öğrenci Bul Butonu */}
                  <div className="md:col-span-3 flex">
                    <button
                      type="submit"
                      className="w-full bg-brandIndigo hover:bg-indigo-700 text-white font-bold rounded-2xl py-3.5 px-6 flex items-center justify-center gap-2 shadow-lg shadow-indigo-500/25 transition-all"
                    >
                      <IconSearch/>
                      <span>Öğrenci Bul</span>
                    </button>
                  </div>
                </form>

                {/* Hızlı Etiketler */}
                <div className="flex flex-wrap items-center justify-center gap-2 mt-6">
                  <span className="text-xs font-semibold text-slate-400">Hızlı Keşfet:</span>
                  {['Aachen', 'Paris', 'Milano', 'Amsterdam'].map((city) => (
                    <button
                      key={city}
                      onClick={() => {
                        setCityQuery(city);
                        setActiveTab('discover');
                      }}
                      className="text-xs font-bold px-3 py-1.5 rounded-full bg-white border border-slate-200 text-slate-600 hover:border-brandIndigo hover:text-brandIndigo transition-colors"
                    >
                      {city}
                    </button>
                  ))}
                </div>

              </section>
            )}

            {/* SEKME 2: DISCOVER (İLAN SONUÇLARI) */}
            {activeTab === 'discover' && (
              <section className="py-12 px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto animate-fade">
                
                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8 pb-6 border-b border-slate-200">
                  <div>
                    <h2 className="text-2xl sm:text-3xl font-extrabold text-brandDark">
                      Öğrenci Ev Sahipleri
                    </h2>
                    <p className="text-sm text-slate-500 mt-1">
                      {cityQuery 
                        ? `"${cityQuery}" araması için ${displayedStudents.length} sonuç gösteriliyor` 
                        : `Tüm dünyadan doğrulanmış ${displayedStudents.length} öğrenci ilanı`}
                    </p>
                  </div>

                  {cityQuery && (
                    <button
                      onClick={() => setCityQuery('')}
                      className="self-start px-4 py-2 rounded-xl bg-slate-200/70 hover:bg-slate-200 text-xs font-bold text-slate-700 transition-colors"
                    >
                      Filtreyi Temizle ({cityQuery})
                    </button>
                  )}
                </div>

                {/* İlan Kartları Listesi */}
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                  {displayedStudents.map((student) => (
                    <div
                      key={student.id}
                      onClick={() => setActiveProfile(student)}
                      className="group bg-white rounded-3xl border border-slate-200/90 overflow-hidden shadow-sm hover:shadow-xl transition-all duration-300 hover:-translate-y-1 cursor-pointer flex flex-col justify-between"
                    >
                      <div>
                        {/* Fotoğraf Alanı */}
                        <div className="relative h-64 overflow-hidden">
                          <img
                            src={student.photo}
                            alt={student.name}
                            className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"
                          />
                          <div className="absolute top-3 left-3 bg-slate-900/75 backdrop-blur-md text-white px-3 py-1 rounded-full text-xs font-bold flex items-center gap-1.5">
                            <IconVerified className="w-4 h-4 text-sky-400"/>
                            <span>.edu Onaylı</span>
                          </div>
                          <div className="absolute bottom-3 right-3 bg-white/95 backdrop-blur-md text-brandDark px-3 py-1 rounded-xl text-sm font-extrabold shadow">
                            {renderPrice(student.priceEUR)} <span className="text-[11px] font-medium text-slate-500">/ gece</span>
                          </div>
                        </div>

                        {/* Kart Bilgileri */}
                        <div className="p-5">
                          <div className="flex items-center justify-between mb-1">
                            <h3 className="text-lg font-extrabold text-brandDark">
                              {student.name}, {student.age}
                            </h3>
                            <span className="text-xs font-bold text-slate-500 flex items-center gap-1">
                              <IconPin/> {student.city}
                            </span>
                          </div>

                          <div className="text-xs font-bold text-brandIndigo mb-3">
                            {student.university} • {student.department}
                          </div>

                          <p className="text-xs text-slate-600 line-clamp-2 leading-relaxed mb-4">
                            {student.bio}
                          </p>

                          <div className="flex flex-wrap gap-1.5">
                            {student.interests.slice(0, 3).map((interest, idx) => (
                              <span key={idx} className="text-[11px] font-semibold px-2.5 py-0.5 rounded-lg bg-slate-100 text-slate-700">
                                {interest}
                              </span>
                            ))}
                          </div>
                        </div>
                      </div>

                      <div className="px-5 py-3 bg-slate-50 border-t border-slate-100 text-xs font-semibold text-slate-500 flex items-center gap-2">
                        <IconBed/>
                        <span className="truncate">{student.roomType}</span>
                      </div>
                    </div>
                  ))}
                </div>

              </section>
            )}

          </main>

          {/* --- 4. TINDER / BUMBLE STİLİ PROFİL MODALI --- */}
          {activeProfile && (
            <div 
              onClick={() => setActiveProfile(null)}
              className="fixed inset-0 z-40 bg-slate-950/70 backdrop-blur-sm flex items-center justify-center p-4 animate-fade"
            >
              <div 
                onClick={(e) => e.stopPropagation()}
                className="bg-white w-full max-w-md rounded-3xl overflow-hidden shadow-2xl border border-slate-200 max-h-[90vh] flex flex-col"
              >
                {/* Üst Kısım: 420px Tam Kaplayan Fotoğraf + Siyah Degrade */}
                <div className="relative h-[420px] w-full flex-shrink-0">
                  <img
                    src={activeProfile.photo}
                    alt={activeProfile.name}
                    className="w-full h-full object-cover"
                  />
                  
                  {/* Kapatma Butonu */}
                  <button
                    onClick={() => setActiveProfile(null)}
                    className="absolute top-4 right-4 w-10 h-10 rounded-full bg-black/50 hover:bg-black/75 text-white flex items-center justify-center backdrop-blur-md transition-colors"
                  >
                    <IconClose/>
                  </button>

                  {/* Fiyat Rozeti */}
                  <div className="absolute top-4 left-4 bg-white/95 backdrop-blur-md px-3.5 py-1.5 rounded-2xl text-sm font-extrabold text-brandDark shadow-lg">
                    {renderPrice(activeProfile.priceEUR)} / gece
                  </div>

                  {/* Alt Siyah Degrade (Gradient) ve Üzerindeki Yazılar */}
                  <div className="absolute inset-x-0 bottom-0 bg-gradient-to-t from-black via-black/60 to-transparent pt-24 pb-6 px-6 text-white">
                    <div className="flex items-center gap-2">
                      <h2 className="text-3xl font-extrabold tracking-tight">
                        {activeProfile.name}, {activeProfile.age}
                      </h2>
                      <IconVerified className="w-6 h-6 text-sky-400"/>
                    </div>
                    <p className="text-sm font-semibold text-indigo-200 mt-1">
                      {activeProfile.university} — {activeProfile.department}
                    </p>
                    <p className="text-xs text-slate-300 flex items-center gap-1 mt-1">
                      <IconPin/> {activeProfile.city}, {activeProfile.country}
                    </p>
                  </div>
                </div>

                {/* Alt Kısım: Beyaz Alan (Bio, Etiketler, İstek Butonu) */}
                <div className="p-6 overflow-y-auto space-y-5 bg-white">
                  
                  {/* Kalınacak Yer Tipi */}
                  <div className="flex items-center gap-2 text-xs font-bold text-slate-700 bg-slate-100 px-3.5 py-2.5 rounded-xl">
                    <IconBed/>
                    <span>Konaklama: {activeProfile.roomType}</span>
                  </div>

                  {/* Detaylı Biyografi */}
                  <div>
                    <h4 className="text-xs font-extrabold uppercase tracking-wider text-slate-400 mb-1.5">
                      Hakkında
                    </h4>
                    <p className="text-sm text-slate-600 leading-relaxed">
                      {activeProfile.bio}
                    </p>
                  </div>

                  {/* İlgi Alanı Etiketleri (Pills) */}
                  <div>
                    <h4 className="text-xs font-extrabold uppercase tracking-wider text-slate-400 mb-2">
                      İlgi Alanları
                    </h4>
                    <div className="flex flex-wrap gap-2">
                      {activeProfile.interests.map((tag, i) => (
                        <span
                          key={i}
                          className="px-3 py-1 rounded-full text-xs font-bold bg-indigo-50 text-brandIndigo border border-indigo-100"
                        >
                          #{tag}
                        </span>
                      ))}
                    </div>
                  </div>

                  {/* Aksiyon Butonu */}
                  <button
                    onClick={() => {
                      const targetName = activeProfile.name;
                      setActiveProfile(null);
                      triggerToast(`${targetName} adlı öğrenciye konaklama ve mesaj isteği başarıyla gönderildi!`);
                    }}
                    className="w-full bg-brandIndigo hover:bg-indigo-700 text-white font-bold py-4 rounded-2xl flex items-center justify-center gap-2 shadow-xl shadow-indigo-500/25 transition-all active:scale-95"
                  >
                    <IconMessage/>
                    <span>İstek Gönder / Mesaj At</span>
                  </button>

                </div>
              </div>
            </div>
          )}

          {/* --- FOOTER --- */}
          <footer className="bg-white border-t border-slate-200/80 py-6 px-4 text-center text-xs text-slate-400 font-medium">
            UniCouch © 2026 — Üniversite Öğrencileri İçin Küresel Konaklama ve Kültür Ağı
          </footer>

        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App/>);
  </script>
</body>
</html>
